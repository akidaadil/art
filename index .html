<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photography — Portfolio</title>
<style>
:root{--blue:#65B7FF;--ink:#202529;--paper:#f2f0e9}
*{box-sizing:border-box}body{margin:0;background:var(--blue);color:var(--ink);font:14px/1.5 Arial,Helvetica,sans-serif}button,a{color:inherit;font:inherit}button{cursor:pointer}a{text-decoration:none}a:hover,nav button:hover{text-decoration:underline}button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:5px}
.home{position:relative;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:110px 24px 90px}
nav{position:absolute;right:clamp(20px,4vw,60px);top:25px;display:flex;flex-direction:column;align-items:flex-end;gap:3px;z-index:10}nav button{border:0;background:none;padding:0;text-align:right}
.contact{position:absolute;left:clamp(20px,4vw,60px);bottom:25px;display:flex;flex-direction:column;z-index:10}
 .collage{width:80vw;height:80svh;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain;touch-action:pan-y;background:#a9b5b8;outline-offset:5px}
.collage::-webkit-scrollbar{display:none}
.strip{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:clamp(48px,7vw,100px);grid-auto-flow:dense;gap:0}
.photo{display:block;min-width:0;min-height:0;padding:0;border:0;overflow:hidden;background:#a9b5b8;grid-column:span 6;grid-row:span 3}
.photo:nth-child(5n+1){grid-column:span 7;grid-row:span 3}.photo:nth-child(5n+2){grid-column:span 5;grid-row:span 4}.photo:nth-child(5n+3){grid-column:span 7;grid-row:span 3}.photo:nth-child(5n+4){grid-column:span 5;grid-row:span 2}.photo:nth-child(5n+5){grid-column:span 12;grid-row:span 4}
.photo img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.72) contrast(.88);transition:transform .5s ease}.photo:hover img{transform:scale(1.025)}.photo:focus-visible{outline-offset:-3px}
dialog{border:0;padding:0;margin:0;max-width:none;max-height:none;width:100%;height:100%;height:100dvh;background:var(--paper);color:var(--ink);overflow:auto}dialog::backdrop{background:var(--paper)}.close{position:fixed;right:22px;top:18px;z-index:20;border:0;background:var(--paper);font-size:28px;width:44px;height:44px}.content{max-width:1100px;margin:auto;padding:80px 25px 45px}.content h1{font-size:24px;font-weight:400;margin:0 0 28px}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start}.gallery img{width:100%;display:block;cursor:zoom-in}.gallery img:only-child{grid-column:1/-1;max-height:75vh;object-fit:contain}.records{list-style:none;padding:0}.records li{padding:20px 0;border-top:1px solid #aaa}.viewer{background:#17191a}.viewer img{width:100%;height:100%;object-fit:contain;padding:55px 15px}.viewer .close{background:#17191a;color:white}
 .home{height:100vh;height:100svh;min-height:0;overflow:hidden;padding:0}
@media(min-width:601px){nav{right:1vw;top:12px;max-width:9vw;font-size:clamp(10px,1vw,14px)}.contact{left:1vw;bottom:12px;font-size:clamp(10px,1vw,14px)}}
@media(max-width:600px){.home{padding:145px 12px 65px}.collage{width:96vw;height:100%;max-height:70svh}.strip{grid-auto-rows:12vw}.gallery{grid-template-columns:1fr}nav{top:12px;gap:1px}.contact{bottom:12px}}
@media(prefers-reduced-motion:reduce){.photo img{transition:none}}
</style>
</head>
<body>
<main class="home">
<nav id="navigation" aria-label="Works and exhibitions"></nav>
<div class="collage" id="collage" tabindex="0" role="region" aria-label="Scrollable photography collage"><div class="strip" id="strip"></div></div>
<div class="contact"><a href="mailto:hello@example.com">Email</a><a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">Instagram ↗</a></div>
</main>
<dialog id="panel" aria-labelledby="panel-title"><button class="close" aria-label="Close" type="button">×</button><div class="content" id="content"></div></dialog>
<dialog id="viewer" class="viewer" aria-label="Full-size photograph"><button class="close" aria-label="Close photograph" type="button">×</button><img id="large-image" alt=""></dialog>
<script>
// Replace these sample titles and image URLs with your own work.
const works = [
 {title:'Between Places',images:['https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=1400&auto=format&fit=crop&q=85']},
 {title:'Quiet Hours',images:['https://images.unsplash.com/photo-1511818966892-d7d671e672a2?w=1400&auto=format&fit=crop&q=85']},
 {title:'Somewhere Else',images:['https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1400&auto=format&fit=crop&q=85']},
 {title:'Fragments',images:['https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=1400&auto=format&fit=crop&q=85']},
 {title:'Still Life',images:['https://images.unsplash.com/photo-1497250681960-ef046c08a56e?w=1400&auto=format&fit=crop&q=85']}
];
// Add real exhibition records here. Example format:
// {year:'2026',title:'Exhibition title',venue:'Gallery, City'}
const exhibitions = [];
const nav=document.getElementById('navigation');
const collage=document.getElementById('collage');
const panel=document.getElementById('panel');
const viewer=document.getElementById('viewer');
const content=document.getElementById('content');
const large=document.getElementById('large-image');
function button(label,action){const b=document.createElement('button');b.type='button';b.textContent=label;b.addEventListener('click',action);return b}
function image(src,alt){const i=document.createElement('img');i.src=src;i.alt=alt;return i}
function heading(title){content.replaceChildren();const h=document.createElement('h1');h.id='panel-title';h.textContent=title;content.append(h)}
function openWork(work){heading(work.title);const gallery=document.createElement('div');gallery.className='gallery';work.images.forEach((src,index)=>{const i=image(src,work.title+' — '+(index+1));i.tabIndex=0;i.setAttribute('role','button');const zoom=()=>{large.src=src;large.alt=i.alt;viewer.showModal()};i.addEventListener('click',zoom);i.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();zoom()}});gallery.append(i)});content.append(gallery);panel.showModal()}
works.forEach((work,index)=>{nav.append(button(work.title,()=>openWork(work)));{const b=button('',()=>openWork(work));b.className='photo';b.setAttribute('aria-label',work.title);b.append(image(work.images[0],work.title));document.getElementById('strip').append(b)}});
nav.append(button('Exhibitions',()=>{heading('Exhibitions');const list=document.createElement('ul');list.className='records';exhibitions.forEach(record=>{const li=document.createElement('li');li.textContent=[record.year,record.title,record.venue].filter(Boolean).join(' — ');list.append(li)});content.append(list);panel.showModal()}));
[panel,viewer].forEach(d=>d.querySelector('.close').addEventListener('click',()=>d.close()));

// Scroll the complete mosaic together, inside the fixed rectangular viewport.
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let target=0,raf=0;
function animate(){const diff=target-collage.scrollTop;if(Math.abs(diff)<1){collage.scrollTop=target;raf=0;return;}collage.scrollTop+=diff*.18;raf=requestAnimationFrame(animate);}
collage.addEventListener('wheel',e=>{if(e.ctrlKey||reduced.matches)return;e.preventDefault();const unit=e.deltaMode===1?16:e.deltaMode===2?collage.clientHeight:1;target=Math.max(0,Math.min(collage.scrollHeight-collage.clientHeight,(raf?target:collage.scrollTop)+e.deltaY*unit));if(!raf)raf=requestAnimationFrame(animate);},{passive:false});
collage.addEventListener('pointerdown',()=>{cancelAnimationFrame(raf);raf=0;});
</script>
</body>
</html>
